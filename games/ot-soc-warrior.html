<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OT CYBERARENA — OT SOC WARRIOR: Incident Commander</title>
<style>
:root{
  --bg:#04070c; --panel:#0a121c; --panel2:#0d1826; --line:#12314a;
  --cyan:#29e6ff; --green:#37ff8b; --amber:#ffb347; --red:#ff3b4d;
  --dim:#7fa3bd; --text:#cfe8f5;
  --mono:'Consolas','Lucida Console','Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--mono);overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;position:relative}

/* ============ HUD ============ */
#hud{display:flex;align-items:center;gap:16px;padding:8px 16px;background:linear-gradient(180deg,#0c1a2a,#070e17);border-bottom:1px solid var(--line);min-height:64px;z-index:20}
#hud .block{display:flex;flex-direction:column;gap:2px}
.hlabel{font-size:10px;letter-spacing:2px;color:var(--dim);text-transform:uppercase}
#scnTitle{font-size:15px;color:var(--cyan);text-shadow:0 0 8px rgba(41,230,255,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
#scnCount{font-size:12px;color:var(--dim)}
#timerBlock{margin-left:auto;margin-right:auto;text-align:center}
#timer{font-size:34px;font-weight:bold;color:var(--green);letter-spacing:4px;text-shadow:0 0 14px rgba(55,255,139,.55);line-height:1}
#timer.warn{color:var(--amber);text-shadow:0 0 14px rgba(255,179,71,.6)}
#timer.crit{color:var(--red);text-shadow:0 0 16px rgba(255,59,77,.8);animation:blinker .5s steps(2) infinite}
@keyframes blinker{50%{opacity:.25}}
#rightHud{display:flex;align-items:center;gap:18px}
.meter{width:150px;height:14px;border:1px solid var(--line);background:#050b12;position:relative;border-radius:2px;overflow:hidden}
.meter .fill{height:100%;background:linear-gradient(90deg,#0e7d4a,var(--green));width:100%;transition:width .4s}
.meter.low .fill{background:linear-gradient(90deg,#7d0e1c,var(--red))}
#score{font-size:20px;color:var(--cyan);text-shadow:0 0 8px rgba(41,230,255,.5)}
#muteBtn{background:none;border:1px solid var(--line);color:var(--dim);padding:6px 10px;cursor:pointer;font-family:var(--mono);font-size:14px;border-radius:3px}
#muteBtn:hover{color:var(--cyan);border-color:var(--cyan)}

/* ============ MAIN ============ */
#main{flex:1;display:flex;min-height:0;position:relative}
#plantwrap{flex:1;position:relative;background:radial-gradient(ellipse at 50% 120%,#0a1f33 0%,#04070c 70%);overflow:hidden}
#plantsvg{width:100%;height:100%;display:block}
#zoneTag{position:absolute;top:10px;left:14px;font-size:11px;letter-spacing:3px;color:var(--dim);background:rgba(5,10,18,.7);padding:4px 10px;border:1px solid var(--line);border-radius:2px;z-index:5}

/* incident marker */
#marker{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;pointer-events:none;display:none;z-index:6}
#marker .ring{position:absolute;inset:0;border:2px solid var(--red);border-radius:50%;animation:ping 1.4s ease-out infinite}
#marker .ring2{animation-delay:.7s}
@keyframes ping{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.5);opacity:0}}
#marker .micon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;filter:drop-shadow(0 0 6px var(--red))}
#markerLabel{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:10px;color:var(--red);background:rgba(10,5,8,.85);padding:2px 6px;border:1px solid var(--red);white-space:nowrap;letter-spacing:1px}

/* alarm beacons + vignette */
.beacon{position:absolute;top:70px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ff8a94,var(--red) 60%,#5c0410);box-shadow:0 0 24px 8px rgba(255,59,77,.0);z-index:15;opacity:.25}
#beaconL{left:12px}#beaconR{right:352px}
.alarm .beacon{animation:beacon 1s ease-in-out infinite}
@keyframes beacon{0%,100%{box-shadow:0 0 8px 2px rgba(255,59,77,.2);opacity:.4}50%{box-shadow:0 0 34px 14px rgba(255,59,77,.85);opacity:1}}
#vignette{position:absolute;inset:0;pointer-events:none;z-index:4;box-shadow:inset 0 0 140px 30px rgba(255,30,50,0);transition:box-shadow .5s}
.alarm #vignette{animation:vign 1.6s ease-in-out infinite}
@keyframes vign{0%,100%{box-shadow:inset 0 0 120px 20px rgba(255,30,50,.12)}50%{box-shadow:inset 0 0 170px 55px rgba(255,30,50,.4)}}

/* ============ COMMS ============ */
#comms{width:340px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:5}
#comms header{padding:8px 12px;font-size:11px;letter-spacing:3px;color:var(--cyan);border-bottom:1px solid var(--line);background:#0b1622;display:flex;justify-content:space-between;align-items:center}
#comms header .live{color:var(--red);animation:blinker 1.2s steps(2) infinite;font-size:10px}
#feed{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.msg{font-size:12px;line-height:1.45;border-left:3px solid var(--dim);padding:5px 8px;background:rgba(255,255,255,.02);animation:msgin .3s ease-out}
@keyframes msgin{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.msg .src{font-size:10px;letter-spacing:1px;display:block;margin-bottom:2px;opacity:.85}
.msg.system{border-color:var(--red)}.msg.system .src{color:var(--red)}
.msg.soc{border-color:var(--cyan)}.msg.soc .src{color:var(--cyan)}
.msg.ops{border-color:var(--amber)}.msg.ops .src{color:var(--amber)}
.msg.intel{border-color:var(--green)}.msg.intel .src{color:var(--green)}
.msg.good{border-color:var(--green);background:rgba(55,255,139,.06)}
.msg.bad{border-color:var(--red);background:rgba(255,59,77,.08)}
.msg.hint{border-color:var(--amber);background:rgba(255,179,71,.06)}

/* ============ ACTION BAR ============ */
#actionbar{background:linear-gradient(180deg,#08101b,#060b13);border-top:1px solid var(--line);padding:10px 14px;z-index:10}
#abHead{font-size:10px;letter-spacing:3px;color:var(--dim);margin-bottom:8px;display:flex;justify-content:space-between}
#abHead .kb{color:#3d5a72}
#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;max-height:26vh;overflow-y:auto}
.card{position:relative;border:1px solid var(--line);background:linear-gradient(180deg,#0e1c2c,#0a1420);padding:9px 10px 9px 40px;cursor:pointer;font-family:var(--mono);color:var(--text);font-size:12px;text-align:left;line-height:1.35;border-radius:3px;transition:all .15s;min-height:52px}
.card:hover:not(.locked){border-color:var(--cyan);background:linear-gradient(180deg,#12253a,#0d1a29);box-shadow:0 0 12px rgba(41,230,255,.25);transform:translateY(-2px)}
.card .cicon{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:19px}
.card .stamp{position:absolute;right:8px;top:6px;font-size:14px;font-weight:bold}
.card.done{border-color:var(--green);color:#9fd8b8;cursor:default;background:rgba(20,60,40,.35)}
.card.done .stamp{color:var(--green)}
.card.trapped{border-color:var(--red);color:#d89aa2;cursor:default;background:rgba(70,15,22,.4)}
.card.trapped .stamp{color:var(--red)}
.card.intelDone{border-color:var(--green);color:#8fc9ad;cursor:default;background:rgba(15,50,40,.3)}
.card.intelDone .stamp{color:var(--cyan)}
.card.oops{animation:oops .4s}
@keyframes oops{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.locked{pointer-events:none}

/* ============ MODAL ============ */
#overlay{position:fixed;inset:0;background:rgba(2,5,9,.88);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:50}
#overlay.show{display:flex}
#modal{width:min(760px,92vw);max-height:88vh;overflow-y:auto;background:linear-gradient(180deg,#0b1826,#070f18);border:1px solid var(--cyan);box-shadow:0 0 40px rgba(41,230,255,.25),inset 0 0 60px rgba(41,230,255,.04);padding:26px 30px;border-radius:4px}
#modal h1{font-size:22px;color:var(--cyan);letter-spacing:4px;text-shadow:0 0 12px rgba(41,230,255,.6);margin-bottom:4px}
#modal h2{font-size:13px;color:var(--dim);letter-spacing:2px;font-weight:normal;margin-bottom:16px}
#modal .body{font-size:13px;line-height:1.6;white-space:pre-wrap}
#modal .body b{color:var(--amber)}
.btnrow{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{background:linear-gradient(180deg,#123147,#0b1f30);border:1px solid var(--cyan);color:var(--cyan);font-family:var(--mono);font-size:14px;letter-spacing:2px;padding:12px 22px;cursor:pointer;border-radius:3px;transition:all .15s}
.btn:hover{background:var(--cyan);color:#04222e;box-shadow:0 0 18px rgba(41,230,255,.6)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.danger:hover{background:var(--red);color:#fff}
.diffbtn.sel{background:var(--cyan);color:#04222e}
.seqlist{margin:10px 0 14px;padding:0;list-style:none}
.seqlist li{padding:6px 10px;border-left:3px solid var(--line);margin-bottom:5px;font-size:12.5px;background:rgba(255,255,255,.02)}
.seqlist li.hit{border-color:var(--green)}
.seqlist li.miss{border-color:var(--red)}
.tag{display:inline-block;font-size:10px;letter-spacing:1px;border:1px solid;padding:1px 7px;border-radius:2px;margin-right:6px}
.tag.g{color:var(--green);border-color:var(--green)}.tag.r{color:var(--red);border-color:var(--red)}
.lesson{margin-top:14px;padding:12px;border:1px dashed var(--amber);background:rgba(255,179,71,.05);font-size:12.5px;line-height:1.55}
.lesson .lt{color:var(--amber);letter-spacing:2px;font-size:10px;display:block;margin-bottom:6px}
table.results{width:100%;border-collapse:collapse;margin:12px 0;font-size:12.5px}
table.results td,table.results th{border:1px solid var(--line);padding:6px 10px;text-align:left}
table.results th{color:var(--cyan);font-size:11px;letter-spacing:1px}
table.results td.win{color:var(--green)}table.results td.loss{color:var(--red)}
.bigrank{font-size:26px;color:var(--green);letter-spacing:4px;text-shadow:0 0 16px rgba(55,255,139,.6);margin:10px 0}

/* ============ FX ============ */
#scan{position:fixed;inset:0;pointer-events:none;z-index:60;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
#flash{position:fixed;inset:0;pointer-events:none;z-index:55;background:rgba(255,40,60,0);transition:background .1s}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,-3px)}80%{transform:translate(5px,4px)}}
#glitch{position:fixed;inset:0;z-index:70;display:none;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,0,60,.15) 0 4px,rgba(0,255,255,.1) 4px 7px,transparent 7px 13px);animation:blinker .12s steps(2) infinite}
.typecursor::after{content:'▊';animation:blinker .7s steps(2) infinite;color:var(--green)}

/* plant svg animations */
.flow{stroke-dasharray:6 10;animation:dashmove 1.2s linear infinite}
@keyframes dashmove{to{stroke-dashoffset:-32}}
.led{animation:ledblink 2.2s ease-in-out infinite}
.led.fast{animation-duration:.7s}
@keyframes ledblink{0%,100%{opacity:.25}50%{opacity:1}}
.steam{animation:steamup 3.4s ease-out infinite;opacity:0}
.steam.s2{animation-delay:1.1s}.steam.s3{animation-delay:2.2s}
@keyframes steamup{0%{transform:translateY(0);opacity:.5}100%{transform:translateY(-46px);opacity:0}}
.flame{transform-origin:640px 118px;animation:flick .35s ease-in-out infinite alternate}
@keyframes flick{from{transform:scaleY(.85) scaleX(.92)}to{transform:scaleY(1.12) scaleX(1.05)}}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="block">
      <span class="hlabel">Incident</span>
      <span id="scnTitle">— STANDBY —</span>
      <span id="scnCount"></span>
    </div>
    <div class="block" id="timerBlock">
      <span class="hlabel">Time to Contain</span>
      <span id="timer">--:--</span>
    </div>
    <div id="rightHud">
      <div class="block">
        <span class="hlabel">Plant Integrity</span>
        <div class="meter" id="integrityMeter"><div class="fill" id="integrityFill"></div></div>
      </div>
      <div class="block">
        <span class="hlabel">Score</span>
        <span id="score">0</span>
      </div>
      <button id="muteBtn" title="Toggle sound">🔊</button>
    </div>
  </header>

  <div id="main">
    <section id="plantwrap">
      <div id="zoneTag">SECTOR 7 PROCESS PLANT — LIVE VIEW</div>
      <svg id="plantsvg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#16283c"/><stop offset=".5" stop-color="#2a4a66"/><stop offset="1" stop-color="#10202f"/>
          </linearGradient>
          <linearGradient id="metal2" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#1a2c3f"/><stop offset=".5" stop-color="#35566f"/><stop offset="1" stop-color="#13212f"/>
          </linearGradient>
          <linearGradient id="skyglow" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#04070c"/><stop offset="1" stop-color="#0b2033"/>
          </linearGradient>
          <radialGradient id="flamegrad" cx=".5" cy=".8" r=".8">
            <stop offset="0" stop-color="#fff3b0"/><stop offset=".45" stop-color="#ffb347"/><stop offset="1" stop-color="#ff3b1d" stop-opacity=".85"/>
          </radialGradient>
        </defs>

        <rect width="1200" height="600" fill="url(#skyglow)"/>
        <!-- stars -->
        <g fill="#9fd4ff" opacity=".5">
          <circle cx="90" cy="60" r="1.2"/><circle cx="240" cy="40" r="1"/><circle cx="410" cy="80" r="1.4"/>
          <circle cx="760" cy="50" r="1"/><circle cx="930" cy="90" r="1.3"/><circle cx="1100" cy="45" r="1"/><circle cx="540" cy="35" r="1.1"/>
        </g>
        <!-- ground -->
        <rect y="520" width="1200" height="80" fill="#060d15"/>
        <g stroke="#0f2334" stroke-width="1">
          <line x1="0" y1="520" x2="1200" y2="520"/><line x1="0" y1="545" x2="1200" y2="545"/><line x1="0" y1="572" x2="1200" y2="572"/>
          <line x1="100" y1="520" x2="60" y2="600"/><line x1="300" y1="520" x2="280" y2="600"/><line x1="500" y1="520" x2="495" y2="600"/>
          <line x1="700" y1="520" x2="712" y2="600"/><line x1="900" y1="520" x2="928" y2="600"/><line x1="1100" y1="520" x2="1145" y2="600"/>
        </g>

        <!-- UNIT 100: storage tanks -->
        <g>
          <rect x="70" y="370" width="120" height="150" fill="url(#metal)" stroke="#3a6280" stroke-width="1.5"/>
          <ellipse cx="130" cy="370" rx="60" ry="14" fill="#2a4a66" stroke="#3a6280" stroke-width="1.5"/>
          <rect x="215" y="400" width="95" height="120" fill="url(#metal)" stroke="#3a6280" stroke-width="1.5"/>
          <ellipse cx="262" cy="400" rx="47.5" ry="11" fill="#2a4a66" stroke="#3a6280" stroke-width="1.5"/>
          <!-- level gauges -->
          <rect x="180" y="390" width="6" height="120" fill="#050b12" stroke="#28455c"/>
          <rect x="181.5" y="440" width="3" height="68" fill="#37ff8b">
            <animate attributeName="y" values="440;455;440" dur="7s" repeatCount="indefinite"/>
            <animate attributeName="height" values="68;53;68" dur="7s" repeatCount="indefinite"/>
          </rect>
          <circle class="led" cx="130" cy="352" r="4" fill="#37ff8b"/>
          <circle class="led fast" cx="262" cy="386" r="4" fill="#ffb347"/>
          <text x="130" y="558" fill="#4d7691" font-size="13" text-anchor="middle" font-family="monospace">UNIT-100 TANK FARM</text>
        </g>

        <!-- pump -->
        <g>
          <rect x="345" y="480" width="52" height="40" fill="#132638" stroke="#3a6280"/>
          <circle cx="371" cy="470" r="20" fill="#0d1e2e" stroke="#3a6280" stroke-width="2"/>
          <g stroke="#29e6ff" stroke-width="3">
            <line x1="371" y1="455" x2="371" y2="485"/><line x1="356" y1="470" x2="386" y2="470"/>
            <animateTransform attributeName="transform" type="rotate" from="0 371 470" to="360 371 470" dur="1.6s" repeatCount="indefinite"/>
          </g>
          <text x="371" y="558" fill="#4d7691" font-size="12" text-anchor="middle" font-family="monospace">P-101</text>
        </g>

        <!-- UNIT 200: column -->
        <g>
          <rect x="450" y="180" width="62" height="340" rx="10" fill="url(#metal2)" stroke="#3a6280" stroke-width="1.5"/>
          <ellipse cx="481" cy="180" rx="31" ry="10" fill="#35566f" stroke="#3a6280"/>
          <line x1="450" y1="250" x2="512" y2="250" stroke="#28455c"/><line x1="450" y1="320" x2="512" y2="320" stroke="#28455c"/>
          <line x1="450" y1="390" x2="512" y2="390" stroke="#28455c"/><line x1="450" y1="460" x2="512" y2="460" stroke="#28455c"/>
          <circle class="led" cx="481" cy="215" r="4" fill="#37ff8b"/>
          <circle class="led fast" cx="481" cy="355" r="4" fill="#37ff8b"/>
          <text x="481" y="558" fill="#4d7691" font-size="13" text-anchor="middle" font-family="monospace">UNIT-200 COLUMN</text>
        </g>

        <!-- CCTV mast -->
        <g>
          <line x1="565" y1="520" x2="565" y2="330" stroke="#28455c" stroke-width="4"/>
          <rect x="552" y="322" width="30" height="14" rx="3" fill="#132638" stroke="#3a6280"/>
          <circle class="led" cx="580" cy="329" r="3" fill="#ff3b4d"/>
          <path d="M552 336 L536 352" stroke="#28455c" stroke-width="2"/>
          <text x="565" y="558" fill="#4d7691" font-size="12" text-anchor="middle" font-family="monospace">CCTV-12</text>
        </g>

        <!-- UNIT 300: flare stack -->
        <g>
          <polygon points="630,520 650,520 646,140 634,140" fill="url(#metal2)" stroke="#3a6280"/>
          <line x1="640" y1="200" x2="600" y2="520" stroke="#1d3850" stroke-width="2"/>
          <line x1="640" y1="200" x2="680" y2="520" stroke="#1d3850" stroke-width="2"/>
          <g class="flame">
            <path d="M640 138 C 628 112, 636 96, 640 82 C 644 96, 654 110, 640 138Z" fill="url(#flamegrad)"/>
            <path d="M640 132 C 634 116, 638 106, 640 96 C 642 106, 647 118, 640 132Z" fill="#fff3b0" opacity=".8"/>
          </g>
          <text x="640" y="558" fill="#4d7691" font-size="13" text-anchor="middle" font-family="monospace">UNIT-300 FLARE</text>
        </g>

        <!-- cooling tower -->
        <g>
          <path d="M760 520 C 775 430, 770 380, 790 340 L 850 340 C 870 380, 865 430, 880 520 Z" fill="url(#metal)" stroke="#3a6280" stroke-width="1.5"/>
          <ellipse cx="820" cy="340" rx="30" ry="8" fill="#10202f" stroke="#3a6280"/>
          <circle class="steam" cx="812" cy="326" r="10" fill="#9fd4ff" opacity=".35"/>
          <circle class="steam s2" cx="828" cy="322" r="13" fill="#9fd4ff" opacity=".3"/>
          <circle class="steam s3" cx="820" cy="318" r="9" fill="#9fd4ff" opacity=".3"/>
          <text x="820" y="558" fill="#4d7691" font-size="13" text-anchor="middle" font-family="monospace">CT-01</text>
        </g>

        <!-- SIS cabinet -->
        <g>
          <rect x="905" y="452" width="46" height="68" fill="#132638" stroke="#c9a227" stroke-width="1.5"/>
          <rect x="912" y="462" width="32" height="20" fill="#050b12" stroke="#28455c"/>
          <circle class="led" cx="928" cy="500" r="4" fill="#ffb347"/>
          <text x="928" y="558" fill="#4d7691" font-size="12" text-anchor="middle" font-family="monospace">SIS</text>
        </g>

        <!-- control room building -->
        <g>
          <rect x="975" y="410" width="200" height="110" fill="#0e1c2c" stroke="#3a6280" stroke-width="1.5"/>
          <rect x="975" y="398" width="200" height="12" fill="#16283c" stroke="#3a6280"/>
          <line x1="1075" y1="398" x2="1075" y2="330" stroke="#28455c" stroke-width="3"/>
          <circle class="led fast" cx="1075" cy="326" r="4" fill="#ff3b4d"/>
          <g fill="#29e6ff" opacity=".85">
            <rect x="990" y="430" width="26" height="18"><animate attributeName="opacity" values="1;.4;1" dur="3.1s" repeatCount="indefinite"/></rect>
            <rect x="1026" y="430" width="26" height="18"><animate attributeName="opacity" values=".5;1;.5" dur="2.3s" repeatCount="indefinite"/></rect>
            <rect x="1062" y="430" width="26" height="18"/>
            <rect x="1098" y="430" width="26" height="18"><animate attributeName="opacity" values="1;.3;1" dur="4s" repeatCount="indefinite"/></rect>
            <rect x="1134" y="430" width="26" height="18"/>
          </g>

/* ============================================================
   ENGINE
   ============================================================ */
const $=s=>document.querySelector(s);
const DIFFS={rookie:{t:600,label:"ROOKIE — 10:00"},operator:{t:420,label:"OPERATOR — 7:00"},veteran:{t:300,label:"VETERAN — 5:00"}};
const COST={step:8,order:25,intel:20,trap:45};
const PTS={step:100,orderBonus:50,intel:25,trap:-100};

/* ---------- audio ---------- */
let AC=null,muted=false;
function initAudio(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==="suspended")AC.resume(); }
function tone(f,dur,type="square",g=0.06,when=0){
  if(!AC||muted)return;
  const o=AC.createOscillator(),v=AC.createGain();
  o.type=type;o.frequency.value=f;
  v.gain.setValueAtTime(g,AC.currentTime+when);
  v.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+when+dur);
  o.connect(v);v.connect(AC.destination);
  o.start(AC.currentTime+when);o.stop(AC.currentTime+when+dur+0.05);
}
const sfx={
  klaxon(){ for(let i=0;i<3;i++){ tone(520,0.28,"sawtooth",0.07,i*0.6); tone(390,0.28,"sawtooth",0.07,i*0.6+0.3);} },
  good(){ tone(660,0.09,"square",0.05); tone(880,0.12,"square",0.05,0.09); },
  intel(){ tone(520,0.08,"sine",0.06); tone(700,0.1,"sine",0.06,0.08); },
  bad(){ tone(160,0.3,"sawtooth",0.09); tone(110,0.35,"sawtooth",0.09,0.12); },
  hint(){ tone(330,0.12,"triangle",0.07); },
  tick(){ tone(1100,0.04,"square",0.04); },
  win(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.16,"square",0.05,i*0.13)); },
  lose(){ [392,330,262,196].forEach((f,i)=>tone(f,0.22,"sawtooth",0.06,i*0.18)); }
};
$("#muteBtn").onclick=()=>{ muted=!muted; $("#muteBtn").textContent=muted?"🔇":"🔊"; };

/* ---------- helpers ---------- */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function fmt(t){ t=Math.max(0,t); return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0"); }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function now(){ const d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0"); }
function addFeed(src,cls,text){
  const f=$("#feed"),m=document.createElement("div");
  m.className="msg "+cls;
  m.innerHTML=`<span class="src">[${now()}] ${esc(src)}</span>${esc(text)}`;
  f.appendChild(m); f.scrollTop=f.scrollHeight;
}
function flashScreen(color){ const fl=$("#flash"); fl.style.background=color; setTimeout(()=>fl.style.background="rgba(255,40,60,0)",140); }
function shake(){ $("#app").classList.remove("shake"); void $("#app").offsetWidth; $("#app").classList.add("shake"); }

/* ---------- marker ---------- */
let markerPos=null;
function placeMarker(x,y,icon,label){
  markerPos={x,y};
  const svg=$("#plantsvg"),wrap=$("#plantwrap"),mk=$("#marker");
  const pt=svg.createSVGPoint(); pt.x=x; pt.y=y;
  const sp=pt.matrixTransform(svg.getScreenCTM());
  const r=wrap.getBoundingClientRect();
  mk.style.left=(sp.x-r.left)+"px"; mk.style.top=(sp.y-r.top)+"px";
  mk.style.display="block";
  if(icon)mk.querySelector(".micon").textContent=icon;
  if(label)$("#markerLabel").textContent=label;
}
window.addEventListener("resize",()=>{ if(markerPos&&G&&G.cur&&!G.cur.over){ const m=G.cur.s.marker; placeMarker(m.x,m.y,m.icon,m.label);} });

/* ---------- game state ---------- */
let G=null,timerInt=null;

function startGame(diff){
  initAudio();
  G={queue:shuffle(SCENARIOS),idx:0,total:0,results:[],diff};
  nextScenario();
}
function nextScenario(){
  if(G.idx>=G.queue.length){ return finalScreen(); }
  const s=G.queue[G.idx];
  G.cur={s,step:0,integrity:100,t:DIFFS[G.diff].t,score:0,intel:0,mistakes:0,traps:0,over:false,hits:[]};
  showBriefing(s);
}

/* ---------- modals ---------- */
function showModal(html){ $("#modal").innerHTML=html; $("#overlay").classList.add("show"); }
function hideModal(){ $("#overlay").classList.remove("show"); }

function startScreen(){
  showModal(`
    <h1>⬢ OT CYBERARENA — OT SOC WARRIOR</h1>
    <h2>INCIDENT COMMANDER SIMULATOR · SECTOR 7 PROCESS PLANT · v1.1.0</h2>
    <div class="body">You are the on-shift <b>OT security incident commander</b>.

Ten cyber incidents will hit this plant in random order — infected USBs, rogue devices, ransomware at the gates, safety-system tampering and worse.

For each incident:
 ▸ The klaxon sounds and the countdown starts.
 ▸ Work the response actions at the bottom of the screen. <b>Five are the correct moves — in one correct order.</b>
 ▸ Intel actions (logs, CCTV, phone calls) are safe: they cost time but reveal what you're facing.
 ▸ Some actions are plausible traps. They damage plant integrity and burn the clock.
 ▸ Timer at zero or integrity at zero = incident lost.

Score: correct step +100 · clean sequence +50 · useful intel +25 · trap −100 · time remaining = bonus.

Select your shift difficulty:</div>
    <div class="btnrow" id="diffRow">
      <button class="btn diffbtn sel" data-d="rookie">${DIFFS.rookie.label}</button>
      <button class="btn diffbtn" data-d="operator">${DIFFS.operator.label}</button>
      <button class="btn diffbtn" data-d="veteran">${DIFFS.veteran.label}</button>
    </div>
    <div class="btnrow"><button class="btn" id="startBtn" style="font-size:17px;padding:14px 34px">▶ START SHIFT</button></div>`);
  let diff="rookie";
  document.querySelectorAll(".diffbtn").forEach(b=>b.onclick=()=>{ document.querySelectorAll(".diffbtn").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); diff=b.dataset.d; });
  $("#startBtn").onclick=()=>{ hideModal(); startGame(diff); };
}

function showBriefing(s){
  showModal(`
    <h1>📡 INCOMING TRANSMISSION</h1>
    <h2>INCIDENT ${G.idx+1} OF ${G.queue.length} — PRIORITY FLASH</h2>
    <div class="body typecursor" id="briefText"></div>
    <div class="btnrow"><button class="btn danger" id="ackBtn" style="visibility:hidden">⏱ ACKNOWLEDGE — START RESPONSE</button></div>`);
  const el=$("#briefText"),txt=s.brief; let i=0;
  sfx.klaxon();
  const iv=setInterval(()=>{
    el.textContent=txt.slice(0,++i);
    if(i%3===0)tone(900+Math.random()*300,0.015,"square",0.015);
    if(i>=txt.length){ clearInterval(iv); el.classList.remove("typecursor"); $("#ackBtn").style.visibility="visible"; }
  },14);
  $("#ackBtn").onclick=()=>{ clearInterval(iv); el.textContent=txt; el.classList.remove("typecursor"); hideModal(); beginScenario(s); };
  $("#briefText").onclick=()=>{ i=txt.length-1; };
}

/* ---------- scenario runtime ---------- */
function beginScenario(s){
  const c=G.cur;
  $("#app").classList.add("alarm");
  $("#liveTag").style.display="inline";
  $("#scnTitle").textContent="⚠ "+s.title;
  $("#scnCount").textContent=`INCIDENT ${G.idx+1} / ${G.queue.length} · ${s.mitre}`;
  $("#feed").innerHTML="";
  addFeed("SYSTEM","system","INCIDENT DECLARED — "+s.title);
  addFeed("SYSTEM","system","Response clock running. Order of actions matters. Good luck, Commander.");
  placeMarker(s.marker.x,s.marker.y,s.marker.icon,s.marker.label);
  renderHud();

  // build cards
  const items=[
    ...s.steps.map((a,i)=>({...a,kind:"step",seq:i})),
    ...s.intel.map(a=>({...a,kind:"intel"})),
    ...s.traps.map(a=>({...a,kind:"trap"}))
  ];
  const cards=$("#cards"); cards.innerHTML="";
  shuffle(items).forEach(item=>{
    const b=document.createElement("button");
    b.className="card";
    b.innerHTML=`<span class="cicon">${item.icon}</span>${esc(item.label)}<span class="stamp"></span>`;
    b.onclick=()=>onCard(b,item);
    cards.appendChild(b);
  });

  clearInterval(timerInt);
  timerInt=setInterval(()=>{
    if(c.over)return;
    c.t--;
    if(c.t<=10&&c.t>0)sfx.tick();
    renderHud();
    if(c.t<=0)endScenario(false,"timeout");
  },1000);
}

function renderHud(){
  const c=G.cur;
  const tm=$("#timer"); tm.textContent=fmt(c.t);
  tm.className=c.t<=45?"crit":(c.t<=120?"warn":"");
  const fill=$("#integrityFill"); fill.style.width=Math.max(0,c.integrity)+"%";
  $("#integrityMeter").classList.toggle("low",c.integrity<=40);
  $("#score").textContent=G.total+Math.max(0,c.score);
  $("#abStatus").textContent=`CONTAINMENT STEPS ${c.step}/${c.s.steps.length} · INTEGRITY ${Math.max(0,c.integrity)}%`;
}

function onCard(btn,item){
  const c=G.cur; if(c.over)return;
  if(item.kind==="step"){
    if(item.seq===c.step){
      c.step++; c.t-=COST.step; c.score+=PTS.step; c.hits.push(item.seq);
      btn.classList.add("done","locked"); btn.querySelector(".stamp").textContent="✔";
      addFeed("OPS","good","✔ "+item.feedback);
      sfx.good(); flashScreen("rgba(55,255,139,.08)");
      if(c.step>=c.s.steps.length){ renderHud(); return endScenario(true); }
    }else{
      c.mistakes++; c.t-=COST.order;
      btn.classList.add("oops"); setTimeout(()=>btn.classList.remove("oops"),450);
      addFeed("OPS","hint",`▲ Hold on — "${item.label}" is a right move, but something is more urgent right now. (−${COST.order}s)`);
      sfx.hint(); flashScreen("rgba(255,179,71,.08)");
    }
  }else if(item.kind==="intel"){
    c.intel++; c.t-=COST.intel;
    if(c.intel<=3)c.score+=PTS.intel;
    btn.classList.add("intelDone","locked"); btn.querySelector(".stamp").textContent="◆";
    addFeed("INTEL","intel","◆ "+item.feedback+` (−${COST.intel}s)`);
    sfx.intel();
  }else{ // trap
    c.traps++; c.t-=COST.trap; c.integrity-=20; c.score+=PTS.trap;
    btn.classList.add("trapped","locked"); btn.querySelector(".stamp").textContent="✘";
    addFeed("SYSTEM","bad",item.feedback+` (−${COST.trap}s, −20% integrity)`);
    sfx.bad(); shake(); flashScreen("rgba(255,40,60,.22)");
    if(c.integrity<=0){ renderHud(); return endScenario(false,"integrity"); }
  }
  renderHud();
  if(c.t<=0)endScenario(false,"timeout");
}

/* ---------- scenario end ---------- */
function endScenario(win,reason){
  const c=G.cur; if(c.over)return; c.over=true;
  clearInterval(timerInt);
  $("#app").classList.remove("alarm");
  $("#liveTag").style.display="none";
  $("#marker").style.display="none"; markerPos=null;
  document.querySelectorAll(".card").forEach(b=>b.classList.add("locked"));

  let timeBonus=0,scnScore;
  if(win){
    timeBonus=Math.floor(Math.max(0,c.t)/4);
    scnScore=Math.max(0,c.score)+timeBonus+(c.mistakes===0?PTS.orderBonus:0);
    sfx.win();
    addFeed("SOC","good","INCIDENT CONTAINED. Well handled, Commander.");
  }else{
    scnScore=Math.max(0,Math.floor(c.score/2));
    sfx.lose();
    $("#glitch").style.display="block"; setTimeout(()=>$("#glitch").style.display="none",900);
    addFeed("SYSTEM","bad",reason==="integrity"?"PLANT INTEGRITY LOST — incident out of control.":"TIME EXPIRED — the window to contain has closed.");
  }
  G.total+=scnScore;
  G.results.push({title:c.s.title,win,score:scnScore,mistakes:c.mistakes,traps:c.traps,intel:c.intel,timeLeft:Math.max(0,c.t)});
  renderHud(); $("#score").textContent=G.total;

  const seq=c.s.steps.map((st,i)=>`<li class="${c.hits.includes(i)?"hit":"miss"}">${i+1}. ${st.icon} ${esc(st.label)}</li>`).join("");
  setTimeout(()=>{
    showModal(`
      <h1 style="color:${win?"var(--green)":"var(--red)"}">${win?"✔ INCIDENT CONTAINED":"✘ INCIDENT LOST"}</h1>
      <h2>${esc(c.s.title)} — DEBRIEF</h2>
      <div class="body">${win
        ? `Contained with <b>${fmt(c.t)}</b> on the clock.`
        : esc(c.s.failText)}

<span class="tag g">+${Math.max(0,c.score)} actions</span>${win?`<span class="tag g">+${timeBonus} time bonus</span>`:""}${win&&c.mistakes===0?`<span class="tag g">+${PTS.orderBonus} clean sequence</span>`:""}${c.traps?`<span class="tag r">${c.traps} trap${c.traps>1?"s":""} triggered</span>`:""}${c.mistakes?`<span class="tag r">${c.mistakes} out-of-order</span>`:""}
<b>Scenario score: ${scnScore}</b>   ·   Running total: ${G.total}</div>
      <div style="margin-top:14px;font-size:11px;letter-spacing:2px;color:var(--dim)">CORRECT RESPONSE SEQUENCE</div>
      <ol class="seqlist">${seq}</ol>
      <div class="lesson"><span class="lt">⚙ FIELD LESSON · ${esc(c.s.mitre)}</span>${esc(c.s.lesson)}</div>
      <div class="btnrow"><button class="btn" id="nextBtn">${G.idx+1>=G.queue.length?"▶ FINAL DEBRIEF":"▶ NEXT INCIDENT"}</button></div>`);
    $("#nextBtn").onclick=()=>{ hideModal(); G.idx++; nextScenario(); };
  },900);
}

/* website integration — parent OT CyberArena page (ot-soc-warrior-play.html)
   listens for this, same postMessage pattern already proven on CyberFlight.
   Added when this game was renamed RED SHIFT -> OT SOC WARRIOR and wired
   into the live site (2026-08-23). */
function submitScore(){
  try{
    const payload={type:"redshift_score",game:"OT_SOC_WARRIOR",version:"1.1.0",
      score:G.total,wins:G.results.filter(r=>r.win).length,total:G.queue.length,
      mistakes:G.results.reduce((a,r)=>a+(r.mistakes||0),0),
      traps:G.results.reduce((a,r)=>a+(r.traps||0),0)};
    if(window.parent&&window.parent!==window)window.parent.postMessage(payload,"*");
  }catch(e){}
}

/* ---------- final screen ---------- */
function finalScreen(){
  const wins=G.results.filter(r=>r.win).length;
  const rank=G.total>=6200?"🏆 OT SENTINEL":G.total>=5000?"⭐ INCIDENT COMMANDER":G.total>=3600?"🛡 SHIFT DEFENDER":G.total>=2000?"🔧 CONTROL ROOM ROOKIE":"📚 TRAINEE — BACK TO THE SIMULATOR";
  const rows=G.results.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.title)}</td><td class="${r.win?"win":"loss"}">${r.win?"CONTAINED":"LOST"}</td><td>${r.score}</td><td>${r.traps}</td><td>${fmt(r.timeLeft)}</td></tr>`).join("");
  $("#scnTitle").textContent="— SHIFT COMPLETE —"; $("#scnCount").textContent="";
  submitScore();
  showModal(`
    <h1>⬢ END OF SHIFT REPORT</h1>
    <h2>SECTOR 7 PROCESS PLANT — ${wins}/${G.queue.length} INCIDENTS CONTAINED</h2>
    <div class="bigrank">${rank}</div>
    <div class="body"><b>TOTAL SCORE: ${G.total}</b></div>
    <table class="results">
      <tr><th>#</th><th>INCIDENT</th><th>RESULT</th><th>SCORE</th><th>TRAPS</th><th>CLOCK LEFT</th></tr>
      ${rows}
    </table>
    <div class="btnrow"><button class="btn" id="againBtn">↻ RUN ANOTHER SHIFT</button></div>`);
  $("#againBtn").onclick=()=>{ G=null; $("#feed").innerHTML=""; $("#timer").textContent="--:--"; $("#timer").className=""; $("#cards").innerHTML=""; $("#score").textContent="0"; $("#integrityFill").style.width="100%"; startScreen(); };
}

/* ---------- boot ---------- */
startScreen();
</script>
</body>
</html>
